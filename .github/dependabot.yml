version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 1
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 1
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action/*"
  - package-ecosystem: "npm"
    directory: "/src/main/frontend"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 1
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
